<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;400;500&family=JetBrains+Mono&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; background: #1e2a1c; color: #f0e8d5; font-family: Manrope, sans-serif; position: relative; overflow: hidden; }
  .lock { position: absolute; left: 80px; top: 72px; display: flex; align-items: center; gap: 22px; }
  .lock svg { width: 46px; height: 40px; }
  .word { font-weight: 200; letter-spacing: .34em; font-size: 20px; text-transform: uppercase; }
  h1 { position: absolute; left: 80px; top: 206px; margin: 0; font-weight: 500; font-size: 96px; line-height: 1.08; letter-spacing: -.02em; }
  .lede { position: absolute; left: 80px; top: 452px; margin: 0; font-size: 28px; color: #d0ccb9; }
  .url { position: absolute; left: 80px; bottom: 64px; font-family: "JetBrains Mono", monospace; font-size: 18px; letter-spacing: .02em; color: #9c9c8b; }
  .rule { position: absolute; left: 80px; right: 80px; bottom: 112px; height: 1px; background: #38432f; }
</style></head>
<body>
  <div class="lock">
    <svg viewBox="0 0 42 36"><rect x="1" y="3" width="28" height="7" rx="3.5" fill="#889068"/><rect x="13" y="15" width="28" height="7" rx="3.5" fill="#F0E8D5"/><rect x="1" y="27" width="28" height="7" rx="3.5" fill="#F0E8D5"/></svg>
    <span class="word">Lumanworth</span>
  </div>
  <h1>Built to last.<br>Yours to keep.</h1>
  <p class="lede">A Perth software company.</p>
  <div class="rule"></div>
  <div class="url">lumanworth.com</div>
</body></html>
